<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ポケモンカードゲーム | OX</title>
  
  <!-- OGP / Twitter Card -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="ポケカ問題クイズ | さぁジャッジ" />
  <meta property="og:description" content="ポケモンカードゲームのルールをクイズで学べる！あなたは何問正解できる？" />
  <meta property="og:image" content="https://sirjudge.com/assets/ogp.png" />
  <meta property="og:url" content="https://sirjudge.com/games/pokemon/ox/" />
  <meta property="og:site_name" content="さぁジャッジ" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="ポケカ問題クイズ | さぁジャッジ" />
  <meta name="twitter:description" content="ポケモンカードゲームのルールをクイズで学べる！あなたは何問正解できる？" />
  <meta name="twitter:image" content="https://sirjudge.com/assets/ogp.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">
  <style>
    :root{ --pink:#f9c9c9; }
    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      /* background:var(--pink); */
      font-family: "Noto Sans JP", sans-serif;
      font-optical-sizing: auto;
      font-weight: 400;
      font-style: normal;
      overflow-x:hidden;
    }
    header{
      max-width:640px; margin:12px auto; padding:0 12px;
      display:flex; align-items:center; justify-content:space-between;
    }
    header a{ color:#374151; text-decoration:underline; font-size:14px; }
    .frame-wrap{ max-width:640px; margin:0 auto 24px; padding:0 12px; }
    /* .frame-outer{ background:transparent; border-radius:20px; box-shadow:0 10px 30px rgba(0,0,0,.06); } */
    iframe.quiz-embed{
      width:100%;
      max-width:100%;
      display:block;
      border:0;
      background:transparent;
      height:100dvh;          /* 初期の仮高さ（postMessageで即更新） */
      min-height: 720px;
      overflow:hidden !important; /* スクロール不可（重要） */
      border-radius:20px;
      pointer-events: auto;   /* iframeとの相互作用を許可 */
    }

    .ox-title{
      margin-top: 24px;
    .logo{
        width: 200px;
        height: auto;
    }
}

.bottom{
  background-color: #fff;
        filter: drop-shadow(0px 2px 8px rgba(0, 0, 0, 0.2));
        border: 1px #E5E7EB solid;
        border-radius: 999px;
        height: auto;
        padding: 1em 1.5em;
        text-decoration: none;
        font-weight: 600;
}
  </style>
</head>
<body>
  <header>
    <div id="pageTitle" class="ox-title"><img class="logo" src="/assets/logo.png"></div>
    <a href="/games/pokemon/" class="bottom">メニューへ戻る</a>
  </header>

  <main class="frame-wrap">
    <div class="frame-outer">
      <!-- 子ページ(quiz.html) を埋め込み。mode/title/data をJSで動的に付与 -->
      <iframe
        id="quizFrame"
        class="quiz-embed"
        src="about:blank"
        loading="lazy"
        scrolling="no"
        allow="fullscreen *; clipboard-write *">
      </iframe>
    </div>
  </main>

<!-- 変更点：JS -->
<script>
(function () {
  const params = new URLSearchParams(location.search);
  const mode  = params.get('mode') === 'renzoku' ? 'renzoku' : 'normal';
  const label = mode === 'renzoku' ? 'れんぞくジャッジ' : 'ふつうにジャッジ';
  const debugId = params.get('debugId'); // デバッグIDを取得
  const titleEl = document.getElementById('pageTitle');
  // if (titleEl) titleEl.textContent = `ポケモンカードゲーム | ${label}`;

  const dataUrl = 'https://script.google.com/macros/s/AKfycby1Nc3nBm-5PKCdZ8pNdNKRPChBbqeXwiZjcEsRZFdkUShDTtym3aJDUZsEWvsW9r8x/exec';
  const embedId = 'poke-ox';
  const shareUrl = mode === 'renzoku' 
    ? 'https://sirjudge.com/games/pokemon/ox/?mode=renzoku'
    : 'https://sirjudge.com/games/pokemon/ox/';
  let quizUrl =
    `/quiz.html?embed=1&embedId=${encodeURIComponent(embedId)}` +
    `&mode=${encodeURIComponent(mode)}` +
    `&title=${encodeURIComponent(label)}` +
    `&data=${encodeURIComponent(dataUrl)}` +
    `&shareTitle=${encodeURIComponent('ポケカ問題クイズ')}` +
    `&shareHashtag=${encodeURIComponent('さぁジャッジ')}` +
    `&normalModeTag=${encodeURIComponent('ふつうにジャッジ')}` +
    `&renzokuModeTag=${encodeURIComponent('れんぞくジャッジ')}` +
    `&shareUrl=${encodeURIComponent(shareUrl)}`;
  
  // デバッグIDがあればURLに追加
  if (debugId) {
    quizUrl += `&debugId=${encodeURIComponent(debugId)}`;
  }

  const iframe = document.getElementById('quizFrame');
  iframe.src = quizUrl;

  // ▼ブート時に「さらに大きめの仮高さ」を即時セット（postMessage前の見切れ防止）
  const bootH = Math.max(Math.floor(window.innerHeight * 0.95), 720);
  iframe.style.height = bootH + 'px';

  // ===== 高さ同期 =====
  let scrolling = false;           // スクロール実行中フラグ
  let pendingHeight = null;        // スクロール中に受け取った高さ
  let lastSetHeight = bootH;       // 最後に設定した高さ
  
  function setHeight(h){
    const minH = bootH;
    const newH = Math.max(minH, Math.ceil(h));
    // 高さは常に最大値を維持（長文でも切れないようにする）
    if (newH > lastSetHeight) {
      lastSetHeight = newH;
      iframe.style.height = newH + 'px';
    }
  }
  
  let scrollTimeout = null; // スクロール要求のデバウンス
  
  window.addEventListener('message', (e) => {
    const d = e.data;
    if (!d || d.id !== embedId) return;
    
    // 高さ同期
    if (d.type === 'quiz-embed-size') {
      if (!scrolling) {
        setHeight(d.height);
      } else {
        // スクロール中は高さを保留
        pendingHeight = d.height;
      }
    }
    
    // スクロール要求（◯×回答後にページ下部へ）
    if (d.type === 'quiz-scroll-bottom') {
      // スクロール中の場合は無視（デバウンス）
      if (scrolling) return;
      
      scrolling = true;
      
      // 高さが指定されていれば先に確定
      if (d.height) {
        const minH = bootH;
        const newH = Math.max(minH, Math.ceil(d.height));
        if (newH > lastSetHeight) {
          lastSetHeight = newH;
          iframe.style.height = newH + 'px';
        }
      }
      
      // スクロール実行
      clearTimeout(scrollTimeout);
      scrollTimeout = setTimeout(() => {
        // iframeの下端位置を計算してスクロール
        const iframeRect = iframe.getBoundingClientRect();
        const iframeBottom = window.scrollY + iframeRect.bottom;
        const targetScroll = iframeBottom - window.innerHeight + 60;
        window.scrollTo({ top: Math.max(0, targetScroll), behavior: 'smooth' });
        
        // スクロール完了後にロック解除
        setTimeout(() => {
          scrolling = false;
          if (pendingHeight !== null) {
            setHeight(pendingHeight);
            pendingHeight = null;
          }
        }, 600);
      }, 100);
    }
    
    // スクロール要求（次の問題でページ上部へ）
    if (d.type === 'quiz-scroll-top') {
      // スクロール中の場合は無視（デバウンス）
      if (scrolling) return;
      
      scrolling = true;
      
      // 高さが指定されていれば先に確定
      if (d.height) {
        const minH = bootH;
        const newH = Math.max(minH, Math.ceil(d.height));
        if (newH > lastSetHeight) {
          lastSetHeight = newH;
          iframe.style.height = newH + 'px';
        }
      }
      
      // スクロール実行
      clearTimeout(scrollTimeout);
      scrollTimeout = setTimeout(() => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
        
        // スクロール完了後にロック解除
        setTimeout(() => {
          scrolling = false;
          if (pendingHeight !== null) {
            setHeight(pendingHeight);
            pendingHeight = null;
          }
        }, 600);
      }, 100);
    }
  });

  // 読み込み・向き変更時に子へ ping（子が高さを再通知）
  function ping(){
    try { iframe.contentWindow.postMessage({ type:'quiz-embed-ping', id: embedId }, '*'); } catch(_){}
  }
  window.addEventListener('load', ping);
  window.addEventListener('orientationchange', () => setTimeout(ping, 350));
})();
</script>

</body>
</html>
