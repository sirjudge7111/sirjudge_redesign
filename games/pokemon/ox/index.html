<!-- games/pokemon/ox/index.html（modeをURLから反映する版） -->
<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ポケモンカードゲーム | OX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">
  <style>
    :root{ --pink:#f9c9c9; }
    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      /* background:var(--pink); */
      font-family: "Noto Sans JP", sans-serif;
      font-optical-sizing: auto;
      font-weight: 400;
      font-style: normal;
      overflow-x:hidden;
    }
    header{
      max-width:640px; margin:12px auto; padding:0 12px;
      display:flex; align-items:center; justify-content:space-between;
    }
    header a{ color:#374151; text-decoration:underline; font-size:14px; }
    .frame-wrap{ max-width:640px; margin:0 auto 24px; padding:0 12px; }
    /* .frame-outer{ background:transparent; border-radius:20px; box-shadow:0 10px 30px rgba(0,0,0,.06); } */
    iframe.quiz-embed{
      width:100%;
      max-width:100%;
      display:block;
      border:0;
      background:transparent;
      height:100dvh;          /* 初期の仮高さ（postMessageで即更新） */
      min-height: 720px;
      overflow:hidden;
      border-radius:20px;
    }

    .ox-title{
      margin-top: 24px;
    .logo{
        width: 200px;
        height: auto;
    }
}

.bottom{
  background-color: #fff;
        filter: drop-shadow(0px 2px 8px rgba(0, 0, 0, 0.2));
        border: 1px #E5E7EB solid;
        border-radius: 999px;
        height: auto;
        padding: 1em 1.5em;
        text-decoration: none;
        font-weight: 600;
}
  </style>
</head>
<body>
  <header>
    <div id="pageTitle" class="ox-title"><img class="logo" src="/assets/logo.png"></div>
    <a href="/games/pokemon/" class="bottom">メニューへ戻る</a>
  </header>

  <main class="frame-wrap">
    <div class="frame-outer">
      <!-- 子ページ(quiz.html) を埋め込み。mode/title/data をJSで動的に付与 -->
      <iframe
        id="quizFrame"
        class="quiz-embed"
        src="about:blank"
        loading="lazy"
        allow="fullscreen *; clipboard-write *">
      </iframe>
    </div>
  </main>

<!-- 変更点：JS -->
<script>
(function () {
  const params = new URLSearchParams(location.search);
  const mode  = params.get('mode') === 'renzoku' ? 'renzoku' : 'normal';
  const label = mode === 'renzoku' ? 'れんぞくジャッジ' : 'ふつうにジャッジ';
  const titleEl = document.getElementById('pageTitle');
  // if (titleEl) titleEl.textContent = `ポケモンカードゲーム | ${label}`;

  const dataUrl = 'https://script.google.com/macros/s/AKfycby1Nc3nBm-5PKCdZ8pNdNKRPChBbqeXwiZjcEsRZFdkUShDTtym3aJDUZsEWvsW9r8x/exec';
  const embedId = 'poke-ox';
  const quizUrl =
    `/quiz.html?embed=1&embedId=${encodeURIComponent(embedId)}` +
    `&mode=${encodeURIComponent(mode)}` +
    `&title=${encodeURIComponent(label)}` +
    `&data=${encodeURIComponent(dataUrl)}`;

  const iframe = document.getElementById('quizFrame');
  iframe.src = quizUrl;

  // ▼ブート時に「さらに大きめの仮高さ」を即時セット（postMessage前の見切れ防止）
  const bootH = Math.max(Math.floor(window.innerHeight * 0.95), 720);
  iframe.style.height = bootH + 'px';

  // ===== 高さ同期 =====
  function setHeight(h){
    const minH = bootH;                      // 取得高さが小さくてもブート時の高さを維持
    iframe.style.height = Math.max(minH, Math.ceil(h)) + 'px';
  }
  
  let pendingScroll = false; // スクロール要求フラグ
  
  window.addEventListener('message', (e) => {
    const d = e.data;
    if (!d || d.id !== embedId) return;
    
    // 高さ同期
    if (d.type === 'quiz-embed-size') {
      setHeight(d.height);
      
      // 保留中のスクロールがあれば実行
      if (pendingScroll) {
        pendingScroll = false;
        setTimeout(() => {
          scrollToBottom();
        }, 50);
      }
    }
    
    // スクロール要求（◯×回答後にページ下部へ）
    if (d.type === 'quiz-scroll-bottom') {
      pendingScroll = true;
      // 高さ更新を待ってからスクロール
      setTimeout(() => {
        if (pendingScroll) {
          pendingScroll = false;
          scrollToBottom();
        }
      }, 200);
    }
    
    // スクロール要求（次の問題でページ上部へ）
    if (d.type === 'quiz-scroll-top') {
      // 高さ更新を待ってからスクロール
      setTimeout(() => {
        scrollToTop();
      }, 100);
    }
  });
  
  function scrollToBottom() {
    // iframeの下端位置を計算してスクロール
    const iframeRect = iframe.getBoundingClientRect();
    const iframeBottom = window.scrollY + iframeRect.bottom;
    const targetScroll = iframeBottom - window.innerHeight + 80; // 80pxの余白
    
    // iOS Safari対応：behavior: 'smooth' が問題を起こす場合があるのでtry-catch
    try {
      window.scrollTo({ top: Math.max(0, targetScroll), behavior: 'smooth' });
    } catch(_) {
      window.scrollTo(0, Math.max(0, targetScroll));
    }
  }
  
  function scrollToTop() {
    // iOS Safari対応
    try {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } catch(_) {
      window.scrollTo(0, 0);
    }
  }

  // 読み込み・向き変更時に子へ ping（子が高さを再通知）
  function ping(){
    try { iframe.contentWindow.postMessage({ type:'quiz-embed-ping', id: embedId }, '*'); } catch(_){}
  }
  window.addEventListener('load', ping);
  window.addEventListener('orientationchange', () => setTimeout(ping, 350));
})();
</script>

</body>
</html>
