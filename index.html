<!DOCTYPE html>
<!-- 言語入力↓ -->
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">
<link rel="icon" href="/assets/favicon.ico" sizes="48x48">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <!-- サイトのタイトル入力↓ -->
  <title>さぁジャッジ！</title>
</head>

<body>
  <!-- div 自由な箱を作り出してくれる便利なやつ本箱とは関係ない↓ -->
  <!-- <div class="background"></div> -->

  <header>
    <img class="logo" src="assets/logo.png">
    <!-- brが改行になる改行したいところに書く↓ -->
    <p>クイズで覚える<br>カードゲームルール</p>
  </header>

  <div class="mark">───</div>

  <section class="sec01">
    <h1>ゲームタイトル</h1>
    <!-- 単語二つ以上はハイフンをつける!!!! -->
    <div class="card-list">
      <a href="/games/pokemon">
        <div class="card-botan">
          <img class="card-img" src="assets/card_pokemon.png">
          <p class="txt">ポケモン<br>カードゲーム</p>
        </div>
      </a>
      <div class="card-botan soon">
        <img class="card-img" src="assets/card_none.png">
        <p class="txt">coming soon...</p>
      </div>
    </div>
  </section>

  <div class="mark">───</div>


  <section class="sec02">
    <h1>あそびかた</h1>
    <div class="txt-area">
      <p>このサイトはクイズでカードゲームの<br>ルールを楽しく覚えられるサイトです。</p>
      <p>ゲームタイトルから覚えたいカード<br>ゲームを選択し、クイズに挑戦してください！</p>
    </div>
  </section>

  <div class="mark">───</div>
  <!-- 最後につける親要素↓ -->
  <footer>
    <small>copyright &copy; さぁジャッジ！制作委員会</small>
  </footer>

</body>

</html>
